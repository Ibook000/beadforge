<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆图纸 · PERLER PATTERN</title>

    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="拼豆图纸 · PERLER PATTERN" />

    <!-- PWA / Web App -->
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="拼豆图纸" />
    <meta name="application-name" content="拼豆图纸" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><circle cx='6' cy='6' r='4' fill='%232c2c2c'/><circle cx='18' cy='6' r='4' fill='%232c2c2c'/><circle cx='30' cy='6' r='4' fill='%232c2c2c'/><circle cx='6' cy='18' r='4' fill='%232c2c2c'/><circle cx='18' cy='18' r='4' fill='%23c9a06c'/><circle cx='30' cy='18' r='4' fill='%232c2c2c'/><circle cx='6' cy='30' r='4' fill='%232c2c2c'/><circle cx='18' cy='30' r='4' fill='%232c2c2c'/><circle cx='30' cy='30' r='4' fill='%232c2c2c'/></svg>" />
    <link rel="icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ==================== 落地页 ==================== -->
    <div id="landing">
      <header class="landing-header">
        <div class="landing-header__left">
          <div class="landing-logo" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <circle cx="6" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="30" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="6" cy="18" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="18" r="4" fill="#c9a06c"/>
              <circle cx="30" cy="18" r="4" fill="#2c2c2c"/>
              <circle cx="6" cy="30" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="30" r="4" fill="#2c2c2c"/>
              <circle cx="30" cy="30" r="4" fill="#2c2c2c"/>
            </svg>
          </div>
          <div class="landing-brand">
            <span class="landing-brand__cn">拼豆图纸</span>
            <span class="landing-brand__en">PERLER PATTERN</span>
          </div>
        </div>
        <nav class="landing-nav">
          <a href="#" class="landing-nav__item landing-nav__item--active">首页<span class="nav-dot"></span></a>
          <a href="#tool" class="landing-nav__item" id="navTool">开始创作</a>
        </nav>
        <div class="landing-header__right">
          <button class="landing-upload-btn" id="landingUpload">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            上传图片
          </button>
        </div>
      </header>

      <section class="hero">
        <div class="hero__left">
          <h1 class="hero__headline">像素创造<br>从拼豆开始</h1>
          <p class="hero__subtitle">将图片转换为拼豆图纸，支持自定义尺寸、颜色替换<br>让创意在方寸之间焕发生机</p>
          <div class="hero__cta">
            <button class="cta-primary" id="ctaStart">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              开始创作
            </button>
          </div>
          <div class="hero__features">
            <div class="feature-item">
              <div class="feature-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
                  <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
                  <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
                </svg>
              </div>
              <span class="feature-label">智能转换</span>
              <span class="feature-desc">CIEDE2000 精准匹配</span>
            </div>
            <div class="feature-item">
              <div class="feature-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <circle cx="12" cy="12" r="4"/>
                  <line x1="12" y1="2" x2="12" y2="6"/>
                  <line x1="12" y1="18" x2="12" y2="22"/>
                  <line x1="2" y1="12" x2="6" y2="12"/>
                  <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
              </div>
              <span class="feature-label">丰富色库</span>
              <span class="feature-desc">多种品牌配色</span>
            </div>
            <div class="feature-item">
              <div class="feature-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <line x1="3" y1="9" x2="21" y2="9"/>
                  <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
              </div>
              <span class="feature-label">自定义尺寸</span>
              <span class="feature-desc">多种模板可选</span>
            </div>
            <div class="feature-item">
              <div class="feature-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"/>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                  <polyline points="7 23 3 19 7 15"/>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
              </div>
              <span class="feature-label">镜像翻转</span>
              <span class="feature-desc">创作更灵活</span>
            </div>
          </div>
        </div>
        <div class="hero__right">
          <div class="hero__color-dots" aria-hidden="true">
            <span class="color-dot" style="background:#c4a882"></span>
            <span class="color-dot" style="background:#b8976e"></span>
            <span class="color-dot" style="background:#d4b896"></span>
            <span class="color-dot" style="background:#c9a87c"></span>
            <span class="color-dot" style="background:#8fa68a"></span>
            <span class="color-dot" style="background:#7a9a8a"></span>
          </div>
          <div class="hero__carousel">
            <div class="carousel-slide carousel-slide--active" id="carouselSlide">
              <div class="carousel-placeholder">
                <img src="/assets/reference-style/cat-bead.png" alt="拼豆猫咪作品" class="carousel-placeholder__img" draggable="false" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ==================== 工具页（原有功能） ==================== -->
    <div id="app" style="display:none">
      <header class="topbar">
        <div class="brand">
          <div class="landing-logo" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
              <circle cx="6" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="30" cy="6" r="4" fill="#2c2c2c"/>
              <circle cx="6" cy="18" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="18" r="4" fill="#c9a06c"/>
              <circle cx="30" cy="18" r="4" fill="#2c2c2c"/>
              <circle cx="6" cy="30" r="4" fill="#2c2c2c"/>
              <circle cx="18" cy="30" r="4" fill="#2c2c2c"/>
              <circle cx="30" cy="30" r="4" fill="#2c2c2c"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-name">拼豆图纸 <span>PERLER PATTERN</span></h1>
          </div>
        </div>
        <button class="back-to-home" id="backToHome" title="返回首页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          返回首页
        </button>
      </header>

      <aside class="panel left-panel" id="controls"></aside>
      <main class="stage" id="stage">
        <button class="fullscreen-btn" id="fsBtn" title="全屏拼豆模式"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
        <div class="empty-hint" id="hint">
          <div class="hint-heart" aria-hidden="true">
            <span style="--c:#c9a06c"></span><span style="--c:#8fa68a"></span><span style="--c:#b8976e"></span><span style="--c:#d4b896"></span><span style="--c:#7a9a8a"></span><span style="--c:#c9a06c"></span>
          </div>
          <p class="hint-title">把照片变成拼豆图纸吧</p>
          <p class="hint-sub">选一张图片或头像 → 挑选喜欢的颜色 → 生成专属图纸</p>
        </div>
      </main>
      <aside class="panel right-panel" id="stats"></aside>
    </div>

    <!-- 全屏拼豆：顶部控制栏 + 右侧面板 -->
    <div class="fs-topbar" id="fsTopbar" style="display:none">
      <span class="fs-title">拼豆 · 拼豆图纸</span>
      <div class="fs-zoom-indicator">
        <button id="fsZoomOut" class="fs-zoom-btn">−</button>
        <span id="fsZoomPct">100%</span>
        <button id="fsZoomIn" class="fs-zoom-btn">+</button>
      </div>
      <button id="fsClose" class="fs-close-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="fs-sidebar" id="fsSidebar" style="display:none">
      <div class="fs-sidebar-header">
        <span class="fs-sidebar-title">颜色选择</span>
        <span class="fs-sidebar-hint">点击高亮同色</span>
      </div>
      <div class="fs-sidebar-list" id="fsSidebarList"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
