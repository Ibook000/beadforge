<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picabead · 拼豆图纸生成器</title>
    <meta name="description" content="把喜欢的照片、头像，变成一颗一颗的彩色拼豆图纸。纯浏览器本地处理，不上传服务器。" />

    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Picabead · 拼豆图纸生成器" />
    <meta property="og:description" content="把喜欢的照片、头像，变成一颗一颗的彩色拼豆图纸 🧸✨ 纯浏览器本地处理，不上传服务器。" />
    <meta property="og:image" content="./logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Picabead · 拼豆图纸生成器" />
    <meta name="twitter:description" content="把喜欢的照片、头像，变成一颗一颗的彩色拼豆图纸" />

    <!-- PWA / Web App -->
    <meta name="theme-color" content="#ff8fb0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Picabead" />
    <meta name="application-name" content="Picabead" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img class="bead-logo" src="/logo.png" alt="Picabead 拼豆小熊 logo" />
          <div class="brand-text">
            <h1 class="brand-name">Picabead <span>拼豆图纸</span></h1>
            <p class="brand-tag">把喜欢的画面，一颗一颗拼出来 🧸✨</p>
          </div>
        </div>
        <div class="brand-dots" aria-hidden="true">
          <span style="--c:#ff8fb0;--d:0s"></span>
          <span style="--c:#d9c2f5;--d:.9s"></span>
          <span style="--c:#ffd98a;--d:1.8s"></span>
          <span style="--c:#a8dfc0;--d:.45s"></span>
          <span style="--c:#ffafcc;--d:1.35s"></span>
        </div>
      </header>

      <aside class="panel left-panel" id="controls"></aside>
      <main class="stage" id="stage">
        <button class="fullscreen-btn" id="fsBtn" title="全屏拼豆模式">⛶</button>
        <div class="empty-hint" id="hint">
          <div class="hint-heart" aria-hidden="true">
            <span style="--c:#ff8fb0"></span><span style="--c:#d9c2f5"></span><span style="--c:#ff8fb0"></span><span style="--c:#ffd98a"></span><span style="--c:#d9c2f5"></span><span style="--c:#ff8fb0"></span>
          </div>
          <p class="hint-title">把照片变成拼豆图纸吧 ♡</p>
          <p class="hint-sub">选一张图片或头像 → 挑选喜欢的颜色 → 生成专属图纸</p>
        </div>
      </main>
      <aside class="panel right-panel" id="stats"></aside>
    </div>

    <!-- 全屏拼豆：顶部控制栏 + 右侧面板 (visible only when stage.fullscreen) -->
    <div class="fs-topbar" id="fsTopbar" style="display:none">
      <span class="fs-title">🧸 Picabead · 拼豆</span>
      <div class="fs-zoom-indicator">
        <button id="fsZoomOut" class="fs-zoom-btn">−</button>
        <span id="fsZoomPct">100%</span>
        <button id="fsZoomIn" class="fs-zoom-btn">+</button>
      </div>
      <button id="fsClose" class="fs-close-btn">✕</button>
    </div>
    <div class="fs-sidebar" id="fsSidebar" style="display:none">
      <div class="fs-sidebar-header">🎨 颜色选择</div>
      <div class="fs-sidebar-list" id="fsSidebarList"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
